---
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
  namespace: vamsi
type: Opaque
data:
  # Values must be base64-encoded
  # echo -n 'admin' | base64  →  YWRtaW4=
  DB_USER: YWRtaW4=
  DB_PASSWORD: c3VwZXJTZWNyZXRQYXNzMTIz
  JWT_SECRET: bXlTdXBlclNlY3JldEpXVGtleQ==
  API_KEY: YWJjZGVmMTIzNDU2Nzg5MA==

---
# Alternative: stringData (Kubernetes auto-encodes to base64)
apiVersion: v1
kind: Secret
metadata:
  name: myapp-secret-plain
  namespace: vamsi
type: Opaque
stringData:
  DB_USER: admin
  DB_PASSWORD: superSecretPass123
  JWT_SECRET: mySuperSecretJWTkey

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-configmap
  namespace: vamsi
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  APP_PORT: "3000"
  DB_HOST: "mongo-service"
  DB_PORT: "27017"
  DB_NAME: "myappdb"

  app.config.json: |
    {
      "featureFlags": {
        "newUI": true,
        "betaFeatures": false
      },
      "timeouts": {
        "request": 30,
        "db": 10
      }
    }
